[build]
publish = "."

[[redirects]]
from = "/source-images/*"
to = "/404.html"
status = 404
force = true

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'sha256-CtLazfsjSMs4YY1qfvxktxZJ/mwi+aYMQTv4HKJtoMs='; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; manifest-src 'self'"

[[headers]]
for = "/assets/img/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/styles.css"
[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/script.js"
[headers.values]
Cache-Control = "public, max-age=604800"
